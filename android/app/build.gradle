plugins {
    id "com.android.application"
    id "kotlin-android"
    // Flutter Gradle Plugin must come after Android and Kotlin plugins
    id "dev.flutter.flutter-gradle-plugin"
    // Google Services — processes google-services.json for Firebase
    id "com.google.gms.google-services"
}

android {
    namespace = "com.example.inventra"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion
    buildToolsVersion = "36.0.0"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.inventra"
        // Firebase requires minSdk >= 23
        minSdk = 23
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
